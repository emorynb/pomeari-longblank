[project]
name = "pomeari-longblank"
version = "0.1.0"
description = "LongBlank extension for Pomeari"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "frontmatter>=3.0.8",
    "pomeari",
]

[tool.uv.sources]
pomeari = { git = "https://github.com/emorynb/pomeari" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[project.entry-points."pomeari.platforms"]
telegraph = "pomeari_longblank.platform:LongBlankPlatform"

[build-system]
requires = ["flit_core>=4"]
build-backend = "flit_core.buildapi"
